[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-agent"
version = "0.1.0"
description = "Production-grade self-hosted document ingestion and retrieval service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "pymilvus>=2.5",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "langchain-text-splitters>=0.3",
    "openai>=1.58",
    "sentence-transformers>=3.3",
    "rank-bm25>=0.2",
    "structlog>=24.4",
    "httpx>=0.28",
    "sse-starlette>=2.1",
    "uv>=0.1.0",  # Python manager for fast dependency installation
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.22",
]
