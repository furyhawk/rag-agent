[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_agent"]
include = ["frontend/**"]

[project]
name = "verity-rag"
version = "0.2.1"
description = "Production-grade self-hosted document ingestion and retrieval service"
authors = [{ name = "furyhawk" }]
license = { text = "MIT" }
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "pymilvus>=2.5",
    "marker-pdf>=1.0",
    "python-docx>=1.1",
    "langchain-text-splitters>=0.3",
    "openai>=1.58",
    "rank-bm25>=0.2",
    "structlog>=24.4",
    "httpx>=0.28",
    "sse-starlette>=2.1",
    "uv>=0.1.0",  # Python manager for fast dependency installation
]

[project.urls]
Homepage = "https://github.com/furyhawk/rag-agent"
Repository = "https://github.com/furyhawk/rag-agent"
Documentation = "https://github.com/furyhawk/rag-agent#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.22",
    "pymupdf>=1.25",  # debug/sample-PDF generation only (scripts/debug_inspect_pipeline.py)
]
local-ml = [
    "sentence-transformers>=3.3",
    "transformers>=4.57",
    "torch>=2.5",
    "Pillow>=10.0",
    "peft>=0.14",
]
